name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Windows package without publishing
        run: npm run dist:win
      - name: Create deterministic draft Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $($env:GITHUB_REF_NAME) does not match package version $version."
          }

          $assets = @(
            "release/LM-Market-Bot-Setup-$version.exe",
            "release/LM-Market-Bot-Setup-$version.exe.blockmap",
            "release/latest.yml"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset -PathType Leaf)) { throw "Required Release asset is missing: $asset" }
          }

          $existingRelease = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not (($existingRelease | ConvertFrom-Json).isDraft)) {
              throw "Release $tag is already published; refusing to replace its assets."
            }
          } else {
            gh release create $tag --draft --verify-tag --title $version --notes-from-tag
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft Release $tag." }
          }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload the complete asset set for $tag." }

          $uploadedNames = @((gh release view $tag --json assets | ConvertFrom-Json).assets.name)
          foreach ($asset in $assets) {
            $name = Split-Path $asset -Leaf
            if ($name -notin $uploadedNames) { throw "Draft Release $tag is missing uploaded asset $name." }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: lm-market-bot-windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
